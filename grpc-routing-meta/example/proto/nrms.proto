// Real-world adoption fixture — the TUTORIAL.zh.md route-A worked example.
// Mirrors a real fab RMS transaction: camelCase/PascalCase field names (protobuf
// C++ getters lowercase these — pins the plugin's lowercase_name() handling) and
// (routing.pctx) on the system's OWN repeated lot message instead of the shared
// common.v1.ProcessContext. No rpc: the projection contract is per-message.
syntax = "proto3";
package nrms.v1;
import "metadata_options.proto";

message msgHeader { string txId = 1; }

message Typ_NRMSLotInfo {
  string LotId = 1 [(routing.pctx) = {key:"LotID"}];
  string carrierId = 2;
}

message rqst_NRMS_GetRecipeSet {
  msgHeader msgHdr = 1;
  string eqpId = 2;
  string recipeId = 3 [(routing.project) = {key:"x-recipe-id", required:true}];
  int32 levelNo = 4;
  string secsVersion = 5;
  int32 LotInfoNo = 6;
  repeated Typ_NRMSLotInfo LotInfo = 7;
  int32 isSingleOrMultiple = 8;
}
